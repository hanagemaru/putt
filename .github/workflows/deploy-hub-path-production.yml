name: Deploy Putt at hanage.app game path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hub-path-production.yml'
      - 'wrangler.hub-production.jsonc'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-live-hub-release.ts'

concurrency:
  group: putt-hub-path-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build game under production hub path
        run: npm run build:hub-preview
        env:
          VITE_RANKING_API_ENABLED: 'true'
          VITE_GAMEPLAY_ANALYTICS: 'true'
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - name: Check built game assets, PWA and canonical
        run: npm run verify:hub-preview
      - name: Check existing old Putt and hub are reachable
        run: |
          node --input-type=module <<'NODE'
          for (const url of [
            'https://putt.hanage.app/',
            'https://putt.hanage.app/api/health',
            'https://hanage.app/',
            'https://hanage.app/games/putt/',
          ]) {
            const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
            if (!response.ok) throw new Error(`Preflight ${url}: HTTP ${response.status}`);
            console.log(`PASS: ${url}`);
          }
          NODE
      - name: Deploy only the new Putt hub-path Worker and routes
        run: npx --yes wrangler@4.148.0 deploy --config wrangler.hub-production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production route and existing shared ranking D1 (GET only)
        run: node --experimental-transform-types --import ./scripts/ts-resolve.mjs scripts/verify-live-hub-release.ts
      - name: Record verified production URL
        if: always()
        run: |
          {
            echo '### Putt production hub-path release'
            echo
            echo 'https://hanage.app/games/putt/play/'
            echo
            echo 'Old Putt: https://putt.hanage.app/ (remains independently playable)'
            echo
            echo 'No production ranking submissions or deletions were made by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
