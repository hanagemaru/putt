name: Menu task implementation

on:
  push:
    branches: [feat/top-menu-tour-selection]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-menu-task.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run validate:challenge
      - run: npm run validate:course
      - run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add top menu and tour selection"
          git push
