name: Apply game navigation exits

on:
  push:
    branches:
      - feat/game-navigation-exits

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-navigation-exits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply implementation
        run: python scripts/apply-navigation-exits.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate challenge
        run: npm run validate:challenge
      - name: Validate course
        run: npm run validate:course
      - name: Check stuck cases
        run: npm run check:stuck
      - name: Check whitespace
        run: git diff --check
      - name: Commit implementation and remove staging files
        run: |
          rm scripts/apply-navigation-exits.py
          rm .github/workflows/apply-navigation-exits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add safe game navigation exits"
          git push origin HEAD:feat/game-navigation-exits
