<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>swipe test — putt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1210;
        color: #e8f0e8;
        font-family: system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* 計測結果。指の下に隠れないよう上端に置く */
      #readout {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 16px 10px;
        pointer-events: none;
        background: linear-gradient(#0e1210e0, #0e121000);
      }
      #numbers {
        display: flex;
        align-items: baseline;
        gap: 22px;
        flex-wrap: wrap;
      }
      .metric {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .metric .label {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #8fa899;
      }
      .metric .value {
        font-size: 44px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .metric .unit {
        font-size: 13px;
        color: #8fa899;
      }
      .metric.sub .value {
        font-size: 26px;
        font-weight: 600;
      }
      #detail {
        margin-top: 6px;
        font-size: 12px;
        color: #7e948a;
        font-variant-numeric: tabular-nums;
      }
      #status {
        margin-top: 4px;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      #status.wait {
        color: #8fa899;
      }
      #status.ng {
        color: #ff8a7a;
      }
      #status.ok {
        color: #9ede8a;
      }

      /* 履歴。右下 */
      #panel {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 268px;
        max-width: calc(100vw - 24px);
        padding: 10px 12px;
        border-radius: 10px;
        background: #0e1210cc;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      #panel h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: #8fa899;
        margin-bottom: 6px;
      }
      #history {
        list-style: none;
      }
      #history li {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 13px;
        padding: 1px 0;
      }
      #history .n {
        width: 14px;
        color: #6d8278;
        font-size: 11px;
      }
      #history .v {
        width: 70px;
        text-align: right;
        font-weight: 600;
      }
      #history .v i {
        font-style: normal;
        font-size: 10px;
        color: #7e948a;
        margin-left: 3px;
      }
      #history .a {
        width: 42px;
        text-align: right;
        color: #b9cfc2;
      }
      #history .o {
        width: 44px;
        text-align: right;
        color: #7e948a;
        font-size: 12px;
      }
      #history .g {
        width: 42px;
        text-align: right;
        color: #b9cfc2;
        font-size: 12px;
      }
      #stats {
        margin-top: 8px;
        padding-top: 7px;
        border-top: 1px solid #2a332e;
        font-size: 11px;
        line-height: 1.5;
        color: #9ab5a6;
      }

      /* 横画面のときだけ出す「縦にしてください」オーバーレイ。縦画面専用（spec §0） */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0e1210;
        color: #e8f0e8;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 56px;
        line-height: 1;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        40% {
          transform: rotate(90deg);
        }
        60%,
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }

      #hint {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: #56685e;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="readout">
      <div id="numbers">
        <div class="metric">
          <span class="label">初速</span>
          <span class="value" id="ballspeed">—</span>
          <span class="unit">m/s</span>
        </div>
        <div class="metric sub">
          <span class="label">速度</span>
          <span class="value" id="speed">—</span>
          <span class="unit">px/s</span>
        </div>
        <div class="metric sub">
          <span class="label">角度</span>
          <span class="value" id="angle">—</span>
          <span class="unit">°(真左から)</span>
        </div>
        <div class="metric sub">
          <span class="label">芯からのズレ</span>
          <span class="value" id="offset">—</span>
          <span class="unit">px</span>
        </div>
        <div class="metric sub">
          <span class="label">減衰</span>
          <span class="value" id="gain">—</span>
          <span class="unit">×</span>
        </div>
        <div class="metric sub">
          <span class="label">バックスイング</span>
          <span class="value" id="backswing">—</span>
          <span class="unit">px</span>
        </div>
      </div>
      <div id="detail"></div>
      <div id="status" class="wait"></div>
      <div id="hint">
        指を置く → オレンジの線を越えるまで右へ引く → 左へ振り抜く（フェースがボールの右端に触れた瞬間が計測点）。<br />
        パターは指の上下に追従します。芯（濃い帯）で当てるほど強く出ます。
      </div>
    </div>

    <div id="panel">
      <h2>直近 10 回</h2>
      <ul id="history"></ul>
      <div id="stats"></div>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>縦にしてください</div>
    </div>

    <script type="module" src="/src/swipe-test.ts"></script>
  </body>
</html>
