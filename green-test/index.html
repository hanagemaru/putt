<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>green test — putt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1210;
        color: #e8f0e8;
        font-family: system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 操作パネル。lil-gui は右上なので下端に置いて重ねない */
      #panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: linear-gradient(#0e121000, #0e1210e8 22%);
      }

      #readout {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin-bottom: 10px;
        font-variant-numeric: tabular-nums;
      }
      .metric {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .metric .label {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #7f9a84;
      }
      .metric .value {
        font-size: 15px;
        font-weight: 600;
      }
      #status {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      #controls {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        align-items: end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .field label {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #7f9a84;
      }
      .field input {
        width: 100%;
        padding: 7px 6px;
        border: 1px solid #33463a;
        border-radius: 6px;
        background: #16201a;
        color: #e8f0e8;
        font-size: 15px;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        text-align: center;
        -webkit-user-select: text;
        user-select: text;
      }
      #buttons {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        padding: 12px 8px;
        border: 0;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
        letter-spacing: 0.08em;
        color: #0e1210;
        background: #7ad17f;
      }
      button.secondary {
        color: #e8f0e8;
        background: #2b3a2f;
      }
      button:active {
        filter: brightness(0.85);
      }
      #hint {
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.5;
        color: #6f8874;
      }

      /* lil-gui は上端から。パネルに被らない高さに収める */
      .lil-gui.lil-root {
        --width: 250px;
        z-index: 20;
        max-height: 56vh;
      }

      /* 縦画面専用（spec §0） */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #101410;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 56px;
        line-height: 1;
      }
      @media (orientation: landscape) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div id="panel">
      <div id="readout">
        <div id="status">構え中</div>
        <div class="metric"><span class="label">位置</span><span class="value" id="pos">–</span></div>
        <div class="metric"><span class="label">速度</span><span class="value" id="speed">–</span></div>
        <div class="metric"><span class="label">転がり</span><span class="value" id="dist">–</span></div>
        <div class="metric"><span class="label">傾斜</span><span class="value" id="slope">–</span></div>
        <div class="metric"><span class="label">MU</span><span class="value" id="mu">–</span></div>
        <div class="metric"><span class="label">カップまで</span><span class="value" id="tocup">–</span></div>
      </div>

      <div id="controls">
        <div class="field"><label for="in-x">ボール X [m]</label><input id="in-x" type="number" step="0.1" inputmode="decimal" /></div>
        <div class="field"><label for="in-z">ボール Z [m]</label><input id="in-z" type="number" step="0.1" inputmode="decimal" /></div>
        <div class="field"><label for="in-speed">初速 [m/s]</label><input id="in-speed" type="number" step="0.1" min="0" inputmode="decimal" /></div>
        <div class="field"><label for="in-dir">方向 [度]</label><input id="in-dir" type="number" step="1" inputmode="decimal" /></div>
      </div>

      <div id="buttons">
        <button id="btn-roll">打つ</button>
        <button id="btn-reset" class="secondary">戻す</button>
      </div>

      <div id="hint">
        方向は 0 が奥（−Z）、+ が右回り。グリーンをタップするとボールを置き直せる。
      </div>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>縦にしてください</div>
    </div>

    <script type="module" src="/src/green-test.ts"></script>
  </body>
</html>
