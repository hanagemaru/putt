<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>putt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* スワイプ操作でブラウザのスクロール・引っ張り更新を起こさない */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* STROKE の 2D オーバーレイ。ボール・パターヘッド・つま先だけを px 空間で描く（spec §4） */
      #stroke {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        z-index: 10;
      }

      /* デバッグ表示（spec §5 の一部。全項目と lil-gui は T4） */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 8px 12px calc(8px + 6px);
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8f0e8;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #hud .row {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        font-size: 12px;
        color: #cfe0d2;
      }
      #hud .state {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #9ede8a;
      }
      #hud .result {
        margin-top: 2px;
        font-size: 15px;
        font-weight: 600;
      }
      /* シードの差し替え。うねりは地形次第なので、いろいろ試せるようにしておく */
      #hud-seed,
      #hud-pixel,
      #hud-shade {
        margin-top: 4px;
        pointer-events: auto;
        appearance: none;
        border: 1px solid rgba(232, 240, 232, 0.45);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: #e8f0e8;
        font: inherit;
        font-size: 12px;
        padding: 4px 12px;
        font-variant-numeric: tabular-nums;
      }
      #hud-pixel,
      #hud-shade {
        margin-left: 6px;
      }
      #hud-seed:disabled {
        opacity: 0.35;
      }
      #hud .notice {
        margin-top: 2px;
        font-size: 12px;
        color: #ffd08a;
        min-height: 15px;
      }

      /* 横画面のときだけ出す「縦にしてください」オーバーレイ。縦画面専用（spec §0） */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #101410;
        color: #e8f0e8;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 56px;
        line-height: 1;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        40% {
          transform: rotate(90deg);
        }
        60%,
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="stroke"></canvas>

    <div id="hud">
      <div class="row">
        <span class="state" id="hud-state">READ</span>
        <span id="hud-view"></span>
        <span id="hud-aim"></span>
        <span id="hud-dist"></span>
        <span id="hud-shots"></span>
      </div>
      <div class="row" id="hud-swing"></div>
      <div class="result" id="hud-result"></div>
      <div class="notice" id="hud-notice"></div>
      <button type="button" id="hud-seed">シード</button>
      <button type="button" id="hud-pixel">ドット OFF</button>
      <button type="button" id="hud-shade">濃淡 勾配</button>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>縦にしてください</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
