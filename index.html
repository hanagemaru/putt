<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>putt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* スワイプ操作でブラウザのスクロール・引っ張り更新を起こさない */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* STROKE の 2D オーバーレイ。ボール・パターヘッド・つま先だけを px 空間で描く（spec §4） */
      #stroke {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        z-index: 10;
      }

      /* デバッグ表示（spec §5 の一部。全項目と lil-gui は T4） */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 8px 12px calc(8px + 6px);
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8f0e8;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #hud .row {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        font-size: 12px;
        color: #cfe0d2;
      }
      #hud .state {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #9ede8a;
      }
      #hud .result {
        margin-top: 2px;
        font-size: 15px;
        font-weight: 600;
      }
      #hud-seed,
      #hud-pixel,
      #hud-line,
      #hud-undulation,
      #hud-adjust {
        margin-top: 4px;
        pointer-events: auto;
        appearance: none;
        border: 1px solid rgba(232, 240, 232, 0.45);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: #e8f0e8;
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        font-variant-numeric: tabular-nums;
      }
      #hud-pixel,
      #hud-line,
      #hud-undulation,
      #hud-adjust {
        margin-left: 4px;
      }
      #hud-seed:disabled,
      #hud-undulation:disabled {
        opacity: 0.35;
      }
      #hud .notice {
        margin-top: 2px;
        font-size: 12px;
        color: #ffd08a;
        min-height: 15px;
      }

      /* 練習用のパター反発調整。入口はSTROKE中だけ表示する */
      #tuning-panel {
        position: fixed;
        top: max(76px, calc(env(safe-area-inset-top) + 76px));
        right: max(10px, env(safe-area-inset-right));
        z-index: 40;
        width: min(280px, calc(100vw - 20px));
        padding: 12px 14px;
        border: 1px solid rgba(232, 240, 232, 0.55);
        border-radius: 14px;
        background: rgba(12, 20, 14, 0.9);
        color: #e8f0e8;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
        line-height: 1.45;
        pointer-events: auto;
      }
      #tuning-panel[hidden] {
        display: none;
      }
      #tuning-panel .tuning-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      #tuning-panel .tuning-value {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 4px;
      }
      #putter-power {
        width: 100%;
        touch-action: manipulation;
      }
      #putter-power-detail {
        margin-top: 4px;
        color: #bcd0c0;
        font-variant-numeric: tabular-nums;
      }

      /* 読みと方向調整を同じ段階に置く。視点切替はスワイプではなく明示的なボタンで行う */
      #camera-controls {
        position: fixed;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        width: max-content;
        max-width: calc(100vw - 16px);
        font-family: system-ui, -apple-system, sans-serif;
      }
      /*
       * STROKE中のボタンは画面下の左右の角へ置く。
       * 真下視点で埋まっているのは中央の横帯（ボール・パター・指のドラッグ経路）と、
       * 残り0.5m未満のときカップが出る中央から左の帯（画面左方向＝狙った方向、§4.1）。
       * どちらも画面の高さの中ほどなので、下の角は空いている
       */
      #stroke-controls,
      #stroke-camera-controls {
        position: fixed;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 30;
        display: none;
        flex-direction: column;
        gap: 6px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      /* 打つのをやめて戻る側は右下 */
      #stroke-controls {
        right: max(10px, env(safe-area-inset-right));
        align-items: flex-end;
      }
      /* 見る向きを変える側は左下 */
      #stroke-camera-controls {
        left: max(10px, env(safe-area-inset-left));
        align-items: flex-start;
      }
      .camera-button,
      #stroke-back,
      .stroke-camera-button {
        appearance: none;
        border: 1px solid rgba(232, 240, 232, 0.55);
        border-radius: 999px;
        background: rgba(12, 20, 14, 0.72);
        color: #e8f0e8;
        min-height: 36px;
        padding: 7px 11px;
        font: inherit;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        touch-action: manipulation;
      }
      .camera-button.active {
        background: rgba(232, 240, 232, 0.92);
        border-color: rgba(255, 255, 255, 0.95);
        color: #162018;
        font-weight: 700;
      }
      #stroke-back {
        min-height: 40px;
        padding-inline: 16px;
        font-size: 12px;
      }

      /* マップは視点バーに並べない。右下へ単独で置き、視点の切り替えと区別する */
      #map-control {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        bottom: max(58px, calc(env(safe-area-inset-bottom) + 58px));
        z-index: 30;
        display: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #map-toggle {
        appearance: none;
        border: 1px solid rgba(232, 240, 232, 0.55);
        border-radius: 999px;
        background: rgba(12, 20, 14, 0.72);
        color: #e8f0e8;
        min-height: 36px;
        padding: 7px 13px;
        font: inherit;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        touch-action: manipulation;
      }
      #map-toggle.active {
        background: rgba(232, 240, 232, 0.92);
        border-color: rgba(255, 255, 255, 0.95);
        color: #162018;
        font-weight: 700;
      }

      #debug-controls[hidden] {
        display: none;
      }

      /* 横画面のときだけ出す「縦にしてください」オーバーレイ。縦画面専用（spec §0） */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #101410;
        color: #e8f0e8;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 56px;
        line-height: 1;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        40% {
          transform: rotate(90deg);
        }
        60%,
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="stroke"></canvas>

    <div id="hud">
      <div class="row">
        <span class="state" id="hud-state">ADDRESS</span>
        <span id="hud-view"></span>
        <span id="hud-aim"></span>
        <span id="hud-dist"></span>
        <span id="hud-shots"></span>
      </div>
      <div class="row" id="hud-swing"></div>
      <div class="result" id="hud-result"></div>
      <div class="notice" id="hud-notice"></div>
      <!-- 開発用。?debug=1 のときだけ表示する -->
      <div id="debug-controls" hidden>
        <button type="button" id="hud-seed">シード</button>
        <button type="button" id="hud-pixel">ドット OFF</button>
        <button type="button" id="hud-line" hidden>ライン</button>
        <button type="button" id="hud-undulation" hidden>地形</button>
      </div>
      <button type="button" id="hud-adjust" style="display: none">強さ</button>
    </div>

    <div id="tuning-panel" hidden>
      <div class="tuning-title">パターの強さ</div>
      <div class="tuning-value">
        <span>強さ</span>
        <strong id="putter-power-value">1.00×</strong>
      </div>
      <input type="range" id="putter-power" />
      <div id="putter-power-detail"></div>
    </div>

    <div id="camera-controls" aria-label="カメラ視点">
      <button type="button" class="camera-button" data-aim-view="AIM">ボール後方</button>
      <button type="button" class="camera-button" data-aim-view="LOW_LINE">低い視点</button>
      <button type="button" class="camera-button" data-aim-view="BEHIND_HOLE">カップ後方</button>
      <button type="button" class="camera-button" data-aim-view="SIDE_MID">横から</button>
    </div>

    <!-- マップは読み視点ではなく一時的な参照画面なので、視点バーとは別に置く -->
    <div id="map-control">
      <button type="button" id="map-toggle">コースマップ</button>
    </div>

    <div id="stroke-controls">
      <button type="button" id="stroke-back">読みに戻る</button>
    </div>

    <div id="stroke-camera-controls" aria-label="見る向きの切り替え">
      <button type="button" class="stroke-camera-button" id="stroke-cup-check">狙いを見る</button>
      <button type="button" class="stroke-camera-button" id="stroke-cup-return">手元を見る</button>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>縦にしてください</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
