<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>putt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* スワイプ操作でブラウザのスクロール・引っ張り更新を起こさない */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* STROKE の 2D オーバーレイ。ボール・パターヘッド・つま先だけを px 空間で描く（spec §4） */
      #stroke {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        z-index: 10;
      }

      /* デバッグ表示（spec §5 の一部。全項目と lil-gui は T4） */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 8px 12px calc(8px + 6px);
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8f0e8;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #hud .row {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        font-size: 12px;
        color: #cfe0d2;
      }
      #hud .state {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #9ede8a;
      }
      #hud .result {
        margin-top: 2px;
        font-size: 15px;
        font-weight: 600;
      }
      /* シードの差し替え。うねりは地形次第なので、いろいろ試せるようにしておく */
      #hud-seed,
      #hud-pixel {
        margin-top: 4px;
        pointer-events: auto;
        appearance: none;
        border: 1px solid rgba(232, 240, 232, 0.45);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: #e8f0e8;
        font: inherit;
        font-size: 12px;
        padding: 4px 12px;
        font-variant-numeric: tabular-nums;
      }
      #hud-pixel {
        margin-left: 6px;
      }
      #hud-seed:disabled {
        opacity: 0.35;
      }
      #hud .notice {
        margin-top: 2px;
        font-size: 12px;
        color: #ffd08a;
        min-height: 15px;
      }

      /* 読みと方向調整を同じ段階に置く。視点切替はスワイプではなく明示的なボタンで行う */
      #camera-controls,
      #stroke-controls {
        position: fixed;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        width: max-content;
        max-width: calc(100vw - 16px);
        font-family: system-ui, -apple-system, sans-serif;
      }
      /* STROKE の姿勢を変えずにカップ方向を見る比較用UI。左側に縦置きする */
      #stroke-camera-controls {
        position: fixed;
        left: max(8px, env(safe-area-inset-left));
        top: 50%;
        transform: translateY(-50%);
        z-index: 30;
        display: none;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .camera-button,
      #stroke-back,
      .stroke-camera-button {
        appearance: none;
        border: 1px solid rgba(232, 240, 232, 0.55);
        border-radius: 999px;
        background: rgba(12, 20, 14, 0.72);
        color: #e8f0e8;
        min-height: 36px;
        padding: 7px 11px;
        font: inherit;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        touch-action: manipulation;
      }
      .camera-button.active,
      .stroke-camera-button.active {
        background: rgba(232, 240, 232, 0.92);
        border-color: rgba(255, 255, 255, 0.95);
        color: #162018;
        font-weight: 700;
      }
      #stroke-back {
        min-height: 40px;
        padding-inline: 16px;
        font-size: 12px;
      }

      /* 横画面のときだけ出す「縦にしてください」オーバーレイ。縦画面専用（spec §0） */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #101410;
        color: #e8f0e8;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 56px;
        line-height: 1;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        40% {
          transform: rotate(90deg);
        }
        60%,
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="stroke"></canvas>

    <div id="hud">
      <div class="row">
        <span class="state" id="hud-state">ADDRESS</span>
        <span id="hud-view"></span>
        <span id="hud-aim"></span>
        <span id="hud-dist"></span>
        <span id="hud-shots"></span>
      </div>
      <div class="row" id="hud-swing"></div>
      <div class="result" id="hud-result"></div>
      <div class="notice" id="hud-notice"></div>
      <button type="button" id="hud-seed">シード</button>
      <button type="button" id="hud-pixel">ドット OFF</button>
    </div>

    <div id="camera-controls" aria-label="カメラ視点">
      <button type="button" class="camera-button" data-aim-view="AIM">方向調整</button>
      <button type="button" class="camera-button" data-aim-view="BEHIND_HOLE">カップ後方</button>
      <button type="button" class="camera-button" data-aim-view="LOW_LINE">低い視点</button>
      <button type="button" class="camera-button" data-aim-view="SIDE_MID">横から</button>
    </div>

    <div id="stroke-controls">
      <button type="button" id="stroke-back">方向調整に戻る</button>
    </div>

    <div id="stroke-camera-controls" aria-label="ストローク中のカップ確認">
      <button type="button" class="stroke-camera-button" id="stroke-cup-check">カップ確認</button>
      <button type="button" class="stroke-camera-button" id="stroke-cup-upright">傾きなし</button>
      <button type="button" class="stroke-camera-button" id="stroke-cup-tilted">傾き30°</button>
      <button type="button" class="stroke-camera-button" id="stroke-cup-return">ストロークに戻る</button>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>縦にしてください</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
