<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>putt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* スワイプ操作でブラウザのスクロール・引っ張り更新を起こさない */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 横画面のときだけ出す「縦にしてください」オーバーレイ。縦画面専用（spec §0） */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #101410;
        color: #e8f0e8;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 56px;
        line-height: 1;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        40% {
          transform: rotate(90deg);
        }
        60%,
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>縦にしてください</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
