<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>putt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* 文字はメニューと同じドット絵フォント（src/pixel-font.ts が入れる） */
        font-family: var(--pixel-font);
        letter-spacing: 0.04em;
        /* スワイプ操作でブラウザのスクロール・引っ張り更新を起こさない */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* STROKE の 2D オーバーレイ。ボール・パターヘッド・つま先だけを px 空間で描く（spec §4） */
      #stroke {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        z-index: 10;
      }

      /* デバッグ表示（spec §5 の一部。全項目と lil-gui は T4） */
      /*
       * 空（薄い水色）の上でもドットの細い線が読めるよう、HUDの後ろへ暗い帯を敷く。
       * 帯の下辺はぼかさず1本の線で切る。カードを出している間は文字ごと引っ込める
       */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: max(8px, env(safe-area-inset-top)) 12px 10px;
        pointer-events: none;
        font-family: var(--pixel-font);
        color: #eef7ec;
        background: rgba(12, 20, 14, 0.72);
        border-bottom: 3px solid #16210f;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.85);
      }
      #hud.quiet {
        background: transparent;
        border-bottom-color: transparent;
      }
      #hud .row {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        font-size: 16px;
        line-height: 1.5;
        color: #dfeade;
      }
      /* 1行目の右上には「トップ」が乗る。文字が下へ潜らないよう場所を空ける */
      #hud .row:first-child {
        padding-right: 76px;
      }
      #hud .state {
        font-size: 16px;
        color: #9ede8a;
      }
      #hud .result {
        margin-top: 4px;
        font-size: 16px;
        line-height: 1.5;
      }
      #hud-seed,
      #hud-pixel,
      #hud-line,
      #hud-undulation,
      #hud-adjust {
        margin-top: 6px;
        pointer-events: auto;
        appearance: none;
        border: 2px solid;
        border-color: #9ede8a #1b3318 #1b3318 #9ede8a;
        border-radius: 0;
        background: rgba(12, 20, 14, 0.82);
        color: #eef7ec;
        font: inherit;
        font-size: 16px;
        padding: 6px 10px;
      }
      #hud-pixel,
      #hud-line,
      #hud-undulation,
      #hud-adjust {
        margin-left: 4px;
      }
      #hud-seed:disabled,
      #hud-undulation:disabled {
        opacity: 0.35;
      }
      #hud .notice {
        margin-top: 2px;
        font-size: 16px;
        line-height: 1.5;
        color: #ffd08a;
        /* 出たり消えたりで帯の高さが動かないよう、1行ぶん空けておく */
        min-height: 24px;
      }

      /* 練習用のパター反発調整。入口はSTROKE中だけ表示する */
      #tuning-panel {
        position: fixed;
        top: max(76px, calc(env(safe-area-inset-top) + 76px));
        right: max(10px, env(safe-area-inset-right));
        z-index: 40;
        width: min(280px, calc(100vw - 20px));
        padding: 12px 14px;
        border: 3px solid #74cf5c;
        box-shadow: 0 0 0 3px #0d140d;
        background: rgba(15, 23, 15, 0.94);
        color: #eef7ec;
        font-family: var(--pixel-font);
        font-size: 16px;
        line-height: 1.5;
        pointer-events: auto;
      }
      #tuning-panel[hidden] {
        display: none;
      }
      #tuning-panel .tuning-title {
        font-size: 16px;
        color: #9ede8a;
        margin-bottom: 8px;
      }
      #tuning-panel .tuning-value {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 4px;
      }
      #putter-power {
        width: 100%;
        touch-action: manipulation;
      }
      #putter-power-detail {
        margin-top: 6px;
        color: #bcd0c0;
      }

      /* 読みと方向調整を同じ段階に置く。視点切替はスワイプではなく明示的なボタンで行う */
      /*
       * ドット絵フォントだと「ボール後方」などの札は1行に4つ並ばない。
       * 折り返しに任せず 2×2 に固定して、押す場所が毎回同じ位置に来るようにする
       */
      #camera-controls {
        position: fixed;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 30;
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        width: max-content;
        max-width: calc(100vw - 16px);
        font-family: var(--pixel-font);
      }
      /*
       * STROKE中のボタンは画面下の左右の角へ置く。
       * 真下視点で埋まっているのは中央の横帯（ボール・パター・指のドラッグ経路）と、
       * 残り0.5m未満のときカップが出る中央から左の帯（画面左方向＝狙った方向、§4.1）。
       * どちらも画面の高さの中ほどなので、下の角は空いている
       */
      #stroke-controls,
      #stroke-camera-controls {
        position: fixed;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 30;
        display: none;
        flex-direction: column;
        gap: 6px;
        font-family: var(--pixel-font);
      }
      /* 打つのをやめて戻る側は右下 */
      #stroke-controls {
        right: max(10px, env(safe-area-inset-right));
        align-items: flex-end;
      }
      /* 見る向きを変える側は左下 */
      #stroke-camera-controls {
        left: max(10px, env(safe-area-inset-left));
        align-items: flex-start;
      }
      /*
       * 画面の上に乗るボタンは、メニューと同じドット絵のベベルにする。
       * 角丸とぼかし影は使わず、上と左を明るく・下と右を暗くして盛り上げ、
       * 押したぶんだけ下の影が消えて沈む
       */
      .camera-button,
      #stroke-back,
      .stroke-camera-button,
      #map-toggle,
      #giveup,
      #home-button,
      .home-dialog-button,
      .score-action {
        appearance: none;
        border-style: solid;
        border-width: 2px;
        border-color: #9ede8a #1b3318 #1b3318 #9ede8a;
        border-radius: 0;
        background: rgba(12, 20, 14, 0.82);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5);
        color: #eef7ec;
        min-height: 40px;
        padding: 9px 11px;
        font: inherit;
        font-size: 16px;
        line-height: 1;
        white-space: nowrap;
        touch-action: manipulation;
      }
      .camera-button:active,
      #stroke-back:active,
      .stroke-camera-button:active,
      #map-toggle:active,
      #giveup:active,
      #home-button:active,
      .home-dialog-button:active,
      .score-action:active {
        transform: translateY(3px);
        border-color: #1b3318 #9ede8a #9ede8a #1b3318;
        box-shadow: none;
      }
      /* 今そこにいることを示す側は白地。反転して見せる */
      .camera-button.active,
      #map-toggle.active {
        background: #eef7ec;
        border-color: #ffffff #4f9844 #4f9844 #ffffff;
        color: #16210f;
      }
      #stroke-back {
        padding-inline: 16px;
      }

      /* マップは視点バーに並べない。右下へ単独で置き、視点の切り替えと区別する */
      #map-control {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        /* 視点バーが2行になったぶん、重ならない高さへ上げる */
        bottom: max(108px, calc(env(safe-area-inset-bottom) + 108px));
        z-index: 30;
        display: none;
        font-family: var(--pixel-font);
      }


      /*
       * ギブアップ（spec §3）。ダブルパーに達したときだけ出す出口。
       * ラウンドを1ホール捨てる操作なので、一度のタップでは確定させず押し続けを要求する。
       * 「進む＝タップ」の規則を壊さないよう、確認カードは重ねずボタンの中だけで完結させる。
       * 置き場所はマップと左右対称の左下。中央のタップ領域からも視点バーからも離す
       */
      #giveup-control {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        bottom: max(108px, calc(env(safe-area-inset-bottom) + 108px));
        z-index: 30;
        display: none;
        font-family: var(--pixel-font);
      }
      /* ラウンドを1ホール捨てる側は赤い縁で他のボタンと分ける */
      #giveup {
        position: relative;
        overflow: hidden;
        border-color: #ffb0b0 #5a2020 #5a2020 #ffb0b0;
        color: #f0d8d8;
      }
      /* 押し続けている間だけ伸びる帯。どれだけ押せば決まるかを指に見せる */
      #giveup-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: rgba(255, 140, 140, 0.45);
        pointer-events: none;
      }
      #giveup-label {
        position: relative;
      }

      #debug-controls[hidden] {
        display: none;
      }

      /* プレイ中の出口。誤タップで離脱しないよう、押した後に確認画面を挟む */
      #home-control {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        z-index: 34;
        display: none;
        font-family: var(--pixel-font);
      }
      #home-button {
        min-width: 62px;
        min-height: 44px;
        padding: 12px 13px;
      }
      #home-dialog {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.58);
        font-family: var(--pixel-font);
        color: #e8f0e8;
        touch-action: manipulation;
      }
      #home-dialog[hidden] {
        display: none;
      }
      /* カードはメニューのパネルと同じ二重枠。角丸とぼかし影は使わない */
      #home-dialog-card {
        width: min(340px, calc(100vw - 32px));
        padding: 20px 16px;
        border: 3px solid #74cf5c;
        box-shadow: 0 0 0 3px #0d140d, 8px 8px 0 rgba(0, 0, 0, 0.5);
        background: rgba(15, 23, 15, 0.96);
        text-align: center;
      }
      #home-dialog-title {
        font-size: 16px;
        color: #9ede8a;
      }
      #home-dialog-message {
        margin-top: 12px;
        color: #bcd0c0;
        font-size: 16px;
        line-height: 1.5;
      }
      #home-dialog-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }
      .home-dialog-button {
        min-height: 44px;
        background: #3a7332;
        /* 2つ並べても「ゲームを続ける」が折り返さない詰め方にする */
        padding: 12px 6px;
        white-space: nowrap;
      }
      /* 進む側は白地。押した後に戻れない操作なので、続ける側と見た目で分ける */
      #home-confirm {
        background: #eef7ec;
        border-color: #ffffff #4f9844 #4f9844 #ffffff;
        color: #16210f;
      }

      /*
       * スコア表示（spec §6）。ホール間はRESULTの俯瞰と軌跡を背景に残したままカードを重ね、
       * ラウンド終了時だけ9ホールの一覧表を出す。
       * タップで進む規則は変えないので、overlay自体は指を通す（pointer-events: none）。
       * 押すのはラウンド終了のボタンだけ
       */
      #score-overlay {
        position: fixed;
        inset: 0;
        z-index: 35;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        pointer-events: none;
        font-family: var(--pixel-font);
        color: #e8f0e8;
      }
      #score-overlay[hidden] {
        display: none;
      }
      #score-card {
        width: min(330px, calc(100vw - 36px));
        padding: 18px 16px;
        border: 3px solid #74cf5c;
        box-shadow: 0 0 0 3px #0d140d, 8px 8px 0 rgba(0, 0, 0, 0.5);
        background: rgba(15, 23, 15, 0.92);
        text-align: center;
      }
      #score-title {
        font-size: 16px;
        letter-spacing: 0.08em;
        color: #9ede8a;
      }
      /* ホール間はこの1行が主役。打数とパー差を大きく出す */
      #score-headline {
        margin-top: 12px;
        font-size: 32px;
        line-height: 1.1;
        text-shadow: 3px 3px 0 #0d140d;
      }
      #score-sub {
        margin-top: 10px;
        font-size: 16px;
        line-height: 1.5;
        color: #bcd0c0;
      }
      /* ラウンド終了の一覧表 */
      #score-table {
        margin-top: 12px;
        width: 100%;
        border-collapse: collapse;
        font-size: 16px;
        line-height: 1.45;
      }
      #score-table[hidden] {
        display: none;
      }
      #score-table th {
        color: #a8bfae;
        font-weight: 400;
        padding-bottom: 4px;
      }
      #score-table th,
      #score-table td {
        padding: 2px 0;
        text-align: center;
      }
      #score-table th:first-child,
      #score-table td:first-child {
        text-align: left;
      }
      #score-table td.diff {
        text-align: right;
        color: #ffd08a;
      }
      #score-table tr.total td,
      #score-table tr.total th {
        border-top: 2px solid rgba(232, 240, 232, 0.4);
        padding-top: 6px;
        color: #eef7ec;
      }
      #score-hint {
        margin-top: 14px;
        font-size: 16px;
        color: #ffe66d;
      }
      #score-hint[hidden] {
        display: none;
      }
      #score-actions {
        display: grid;
        gap: 8px;
        margin-top: 14px;
        pointer-events: auto;
      }
      #score-actions[hidden],
      .score-action[hidden] {
        display: none;
      }
      .score-action {
        min-height: 44px;
        background: #3a7332;
        padding: 12px 18px;
      }
      /* 遊び続ける側は白地。トップへ戻る側と見た目で分ける */
      #score-course,
      #score-again {
        background: #eef7ec;
        border-color: #ffffff #4f9844 #4f9844 #ffffff;
        color: #16210f;
      }

      /* 横画面のときだけ出す「縦にしてください」オーバーレイ。縦画面専用（spec §0） */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #101410;
        color: #eef7ec;
        font-family: var(--pixel-font);
        font-size: 16px;
        letter-spacing: 0.12em;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 56px;
        line-height: 1;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        40% {
          transform: rotate(90deg);
        }
        60%,
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="stroke"></canvas>

    <div id="hud">
      <div class="row">
        <span class="state" id="hud-state">ADDRESS</span>
        <span id="hud-view"></span>
        <span id="hud-aim"></span>
        <span id="hud-dist"></span>
        <span id="hud-shots"></span>
      </div>
      <div class="row" id="hud-swing"></div>
      <div class="result" id="hud-result"></div>
      <div class="notice" id="hud-notice"></div>
      <!-- 開発用。?debug=1 のときだけ表示する -->
      <div id="debug-controls" hidden>
        <button type="button" id="hud-seed">シード</button>
        <button type="button" id="hud-pixel">ドット OFF</button>
        <button type="button" id="hud-line" hidden>ライン</button>
        <button type="button" id="hud-undulation" hidden>地形</button>
      </div>
      <button type="button" id="hud-adjust" style="display: none">強さ</button>
    </div>

    <div id="home-control">
      <button type="button" id="home-button" aria-label="トップへ戻る">トップ</button>
    </div>

    <div id="tuning-panel" hidden>
      <div class="tuning-title">パターの強さ</div>
      <div class="tuning-value">
        <span>強さ</span>
        <strong id="putter-power-value">1.00×</strong>
      </div>
      <input type="range" id="putter-power" />
      <div id="putter-power-detail"></div>
    </div>

    <div id="camera-controls" aria-label="カメラ視点">
      <button type="button" class="camera-button" data-aim-view="AIM">ボール後方</button>
      <button type="button" class="camera-button" data-aim-view="LOW_LINE">低い視点</button>
      <button type="button" class="camera-button" data-aim-view="BEHIND_HOLE">カップ後方</button>
      <button type="button" class="camera-button" data-aim-view="SIDE_MID">横から</button>
    </div>

    <!-- マップは読み視点ではなく一時的な参照画面なので、視点バーとは別に置く -->
    <div id="map-control">
      <button type="button" id="map-toggle">コースマップ</button>
    </div>

    <!-- ダブルパーに達したときだけ出す出口。押し続けで確定する（spec §3） -->
    <div id="giveup-control">
      <button type="button" id="giveup">
        <span id="giveup-fill"></span>
        <span id="giveup-label">ギブアップ</span>
      </button>
    </div>

    <div id="stroke-controls">
      <button type="button" id="stroke-back">読みに戻る</button>
    </div>

    <div id="stroke-camera-controls" aria-label="見る向きの切り替え">
      <button type="button" class="stroke-camera-button" id="stroke-cup-check">狙いを見る</button>
    </div>

    <!-- ホール間とラウンド終了のスコア表示。3Dの上に重ねる -->
    <div id="score-overlay" hidden>
      <div id="score-card">
        <div id="score-title"></div>
        <div id="score-headline"></div>
        <div id="score-sub"></div>
        <table id="score-table" hidden>
          <tbody id="score-rows"></tbody>
        </table>
        <div id="score-hint"></div>
        <div id="score-actions" hidden>
          <button type="button" class="score-action" id="score-course">コース選択へ</button>
          <button type="button" class="score-action" id="score-again">もう一度</button>
          <button type="button" class="score-action" id="score-home">トップへ</button>
        </div>
      </div>
    </div>

    <div
      id="home-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="home-dialog-title"
      hidden
    >
      <div id="home-dialog-card">
        <div id="home-dialog-title">トップへ戻りますか？</div>
        <div id="home-dialog-message"></div>
        <div id="home-dialog-actions">
          <button type="button" class="home-dialog-button" id="home-cancel">ゲームを続ける</button>
          <button type="button" class="home-dialog-button" id="home-confirm">トップへ戻る</button>
        </div>
      </div>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>縦にしてください</div>
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
